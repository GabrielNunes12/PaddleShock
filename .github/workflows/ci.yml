name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  java-tests:
    name: Java (MatchSimulation, NetProtocol)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run gradle test suite
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

  lobby-lambda-tests:
    name: Node (ranked ladder LP math)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws/lobby-lambda
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run node --test suite
        run: npm test
