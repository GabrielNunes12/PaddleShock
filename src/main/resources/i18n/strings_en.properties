# PaddleShock UI strings - English (base language, source of truth for keys).
# One key per screen/section, prefixed by the screen it belongs to (e.g. options.*, menu.*).
# Keep strings_en.properties and strings_pt_BR.properties in lockstep: every key here must
# also exist in the PT-BR file, and vice versa (I18n falls back to English for a missing key,
# so nothing crashes, but a missing translation is a bug to fix, not a valid end state).

